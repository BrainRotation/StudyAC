<!DOCTYPE html>  <!-- 버전이 Html5임을 명시 -->
<html lang="en"> 
<head> <!-- head는 웹페이지의 정보가 들어가는 곳 -->
    <meta charset="UTF-8"> <!-- UTF-8 인코딩 전세계에서 문자가 잘 안깨짐 어딜가나 다 이것을 사용함 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY HOME</title> <!-- 페이지 제목 -->
</head>
<body>
    <h1>Hello</h1> <!-- h1~h6까지 제목을 나타내는 태그 h1이 가장 크고 h6이 가장 작음 -->
    <h2>Hello</h2> <!-- h태그를 잘 사용하지 않는다 CSS가지고 꾸미는게 더 디테일하고 이쁘게 꾸밀 수 있음 -->
    <h3>Hello</h3> 
    <h4>Hello</h4>
    <h5>Hello</h5>
    <h6>Hello</h6>

    <!-- p 일반적인 본무 단락을 작성할 때 사용 -->
    <p>p태그는 일반적인 본무 단락을 작성할 때 사용</p>
    <p>p태그는 일반적인 본무 단락을 작성할 때 사용</p>
    <p>lorem ipsum dolor sit amet consectetur adipisicing elit.<br> Quisquam, voluptatum!</p>

    <!--
    br
    강제로 줄 바꿈할때 사용하는 태그
    -->
    
    <!--
    hr
    수평선 만들때 사용. 나홀로 태그
    -->
    <hr>

    <!-- 
    strong
    글자를 굵게 만들때 사용
    -->
    <strong>굵은 글자</strong>

    <!-- 
    b
    글자를 굵게 만들때 사용
    -->
    <b>굵은 글자</b> <!-- strong과 b는 같은 기능을 하지만 strong은 의미론적 태그로써 글자가 굵은 이유를 나타낼 수 있음 -->

    <!--
    i
    이탤릭체로 변경ㅇ
    -->
    <i>이탤릭체</i>





</body>
</html>
