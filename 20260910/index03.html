<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDEX03</title>
</head>
<body>

    <!-- 
    ul, ol, li - 목록(list)
    ul - 순서 없는 목록, ol - 순서 있는 목록, li - 목록 항
    많이 사용됨
    -->
    <ul>
        <li>짜장면</li>
        <li>짬뽕</li>
        <li>우동</li>
        <li>탕수육</li>
    </ul>

    <ol>
        <li>짜장면</li>
        <li>짬뽕</li>
        <li>우동</li>
        <li>탕수육</li>
    </ol>
    <!--
    dl, dt, dd - 정의 목록
    dl - 정의 목록, dt - 정의할 단어, dd - 정의할 내용
    요즘은 잘 사용하지 않음(한때 유행을 했었음.)
    -->
    <dl>
        <dt>HTML</dt>
        <dd>웹 문서를 구조화하는 마크업 언어</dd>

        <dt>CSS</dt>
        <dd>웹 문서의 디자인을 담당하는 스타일 시트 언어</dd>

        <dt>JavaScript</dt>
        <dd>프론트엔드 프로그래밍 언어</dd>
    </dl>

</body>
</html>
