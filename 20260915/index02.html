<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>INDEX02</title>
</head>
<body>
    <!-- 공간을 분할하는 태그 = div 세로로는 분할 수 없음. 가로로만 분할 가능. 레이아웃을 구성하는 데 사용됨. 현업에서 제일많이 사용됨. -->
    <!-- div는 block 요소이므로 width를 지정하지 않으면 화면 전체를 차지함. -->
    <!-- div는 table과 달리 공간을 분할하는 용도로만 사용. table은 table안에 table을 계속 생성해야함. 유지보수차원에서 좋지 않음. -->
    <div>
        여기는 네이버 header 에요.
    </div>
    <div>
        여기는 네이버 search 에요.
    </div>
    <div>
        여기는 네이버 GNB(Global Navigation Bar) 에요.
    </div>
    <!-- 공간 분할 태그 = 시멘틱태그 공간에다가 의미를 부여한 태그. 각 사이트마다의 검색엔진은 그 사이트의 글을 쫙 읽을 것이다. 근데 검색엔진은 검색에 관련된 정보만 읽는다. 그래서 분할을 시켜두면 검색엔진
     입장에서 타이틀은 이름이구나 ㅁㅁ, 검색은 검색이구나, GNB는 메뉴구나 라고 인식할 수 있음. 베너는 읽을 필요가 없으면 바로 넘어감. 검색엔진이 좀 더 사이트를 더 잘 이해할 수 있도록
     편하게 할려고 시멘틱태그를 사용함. div로 되어있으면 처음부터 다 읽음. (SEO에 더 잘 걸릴려면 시멘틱태그를 사용해야 함.)-->
    <!-- header, search, nav, main, article, section, aside, footer -->
    <header>
        여기는 네이버 header 에요.
    </header>

    <serch>
        여기는 네이버 search 에요.
    </serch>
    <nav>
        여기는 네이버 GNB(Global Navigation Bar) 에요.
    </nav>


</body>
</html>
