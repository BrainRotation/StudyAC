<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>INDEX 02-1</title>
    <style>
        table {
            border-collapse: collapse; /* 테이블의 선을 겹치게 함 */
            width: 500px; /* 테이블의 너비를 500px로 지정 */
        }
        td {
            border: 1px solid #ccc; /* 테이블의 선을 회색으로 지정 */
            padding: 5px; /* 셀 내부의 여백을 설정 */
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td></td>
            <td>국어</td>
            <td>영어</td>
            <td>수학</td>
        </tr>
        <tr>
            <td>홍길동</td>
            <td>90</td>
            <td>100</td>
            <td>50</td>
        </tr>        
        <tr>
            <td>박찬호</td>
            <td>100</td>
            <td>80</td>
            <td>75</td>
        </tr>        
        <tr>
            <td>박세리</td>
            <td>75</td>
            <td>85</td>
            <td>95</td>
        </tr>
    </table>
</body>
</html>
